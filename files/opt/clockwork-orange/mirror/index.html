<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uConsole Remote</title>
<style>
  :root { --bg: #14110f; --panel: #1d1916; --panel-2: #262019; --line: #3a3027;
    --text: #f3ece4; --muted: #a8998a; --accent: #ff7a1a; --accent-2: #ffb066; --ok: #5fd38d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.35 "Nunito Sans", "Noto Sans", system-ui, sans-serif; overflow: hidden; }
  body { display: grid; grid-template-columns: 270px 1fr; }
  body.hide { grid-template-columns: 0 1fr; }
  body.hide aside { visibility: hidden; }
  aside { border-right: 1px solid var(--line); overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .12em; font-size: 14px; margin: 2px 0 8px; }
  .brand img { width: 28px; height: 28px; } .brand b { color: var(--accent); }
  h2 { margin: 10px 0 4px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent-2); }
  .app { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 8px; padding: 6px 8px;
    border: 1px solid transparent; border-radius: 10px; }
  .app:hover { background: var(--panel); border-color: var(--line); }
  .app img { width: 30px; height: 30px; }
  .app .name { font-weight: 700; } .app .desc { color: var(--muted); font-size: 12px; }
  .acts { display: flex; gap: 4px; }
  .btn { border: 1px solid var(--accent); background: transparent; color: var(--accent-2); border-radius: 8px;
    padding: 3px 8px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; text-decoration: none; }
  .btn:hover, .btn:focus-visible { background: var(--accent); color: #1b0f05; outline: none; }
  .btn.ghost { border-color: var(--line); color: var(--muted); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
  main { position: relative; min-width: 0; }
  iframe { border: 0; width: 100%; height: 100%; display: block; background: #000; }
  #tog { position: absolute; top: 8px; left: 8px; z-index: 2; opacity: .75; }
  #tog:hover { opacity: 1; }
  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(80px); transition: transform .2s;
    background: var(--accent); color: #1b0f05; font-weight: 800; padding: 9px 16px; border-radius: 12px; z-index: 5; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; grid-template-rows: 45% 55%; }
    body.hide { grid-template-rows: 0 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<aside>
  <div class="brand"><img src="/icon/co-hub" alt="">CLOCKWORK <b>ORANGE</b></div>
  <div id="apps"></div>
  <div class="hint"><b>Open</b> = web app in a new tab here. <b>Screen</b> / <b>Launch</b> = start it on the uConsole (shown on the right).
    SDR / LoRa apps pause Looking Glass / Meshtastic while they run.</div>
</aside>
<main>
  <button class="btn" id="tog" title="Show / hide the app list">☰ Apps</button>
  <iframe id="vnc" src="vnc.html?autoconnect=1&amp;resize=scale&amp;reconnect=1&amp;show_dot=1" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
</main>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2200); }
async function launch(id) {
  try { const j = await (await fetch("/api/launch/" + id, {method: "POST"})).json(); toast(j.msg || (j.ok ? "launched" : "failed")); }
  catch (e) { toast("console not responding"); }
}
async function load() {
  const cfg = await (await fetch("/apps.json")).json(), root = $("#apps");
  for (const g of cfg.groups) {
    const apps = cfg.apps.filter(a => a.group === g);
    if (!apps.length) continue;
    root.insertAdjacentHTML("beforeend", `<h2>${esc(g)}</h2>`);
    for (const a of apps) {
      const url = a.web && a.web.replace("{host}", location.hostname);
      const acts = url
        ? `<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Open</a><button class="btn ghost" data-l="${esc(a.id)}">Screen</button>`
        : `<button class="btn" data-l="${esc(a.id)}">Launch</button>`;
      root.insertAdjacentHTML("beforeend", `<div class="app"><img src="/icon/${esc(a.icon)}" alt="">
        <div><div class="name">${esc(a.name)}</div><div class="desc">${esc(a.desc)}</div></div><div class="acts">${acts}</div></div>`);
    }
  }
  root.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { launch(b.dataset.l); $("#vnc").focus(); });
}
try { if (localStorage.getItem("co_mirror_hide") === "1") document.body.classList.add("hide"); } catch (e) {}
$("#tog").onclick = () => { const h = document.body.classList.toggle("hide"); try { localStorage.setItem("co_mirror_hide", h ? "1" : "0"); } catch (e) {} };
load();
</script>
</body>
</html>
