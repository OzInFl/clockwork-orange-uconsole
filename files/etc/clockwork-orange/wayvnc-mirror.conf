# wayvnc for the remote console only (co-mirror-vnc, 127.0.0.1:5901). Pi OS's own wayvnc on :5900 offers only
# VeNCrypt/TLS and RSA-AES variants that noVNC can't speak; relax_encryption adds Apple-DH login (type 30), which it
# can. The password is checked by PAM (the uConsole account) and crosses the LAN only inside co-mirror's HTTPS.
enable_auth=true
enable_pam=true
relax_encryption=true
